name: Final Owner Shell Cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: "!contains(github.event.head_commit.message, '[final-owner-cleanup]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final cleanup
        run: python scripts/final_owner_cleanup.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Build
        env:
          VITE_SUPABASE_URL: https://kwzdxqhzhnmrjfyhgzxa.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_57Izo4dN0fAYzt6jYA_EQ_TkoDHPty
        run: npm run build
      - name: Remove one-shot tooling and commit
        run: |
          rm -f scripts/final_owner_cleanup.py .github/workflows/final-owner-cleanup.yml
          git config user.name "Atelier OG Bot"
          git config user.email "atelierog.co.in@users.noreply.github.com"
          git add src/main.jsx scripts/final_owner_cleanup.py .github/workflows/final-owner-cleanup.yml
          git commit -m "Final Gym Manager Owner shell cleanup [final-owner-cleanup]"
          git push
