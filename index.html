<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <meta name="theme-color" content="#070a0f">
  <meta name="description" content="Gym Manager — simple gym management for owners, trainers and members.">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg?v=8" type="image/svg+xml">
  <title>Gym Manager</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#070a0f}
    #boot-splash{position:fixed;inset:0;z-index:99999;overflow:hidden;background:#070a0f;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;opacity:1;visibility:visible;transition:opacity 1.05s cubic-bezier(.22,.61,.36,1),visibility 1.05s}
    #boot-splash.is-done{opacity:0;visibility:hidden;pointer-events:none}.boot-scene{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 28%,rgba(220,225,230,.18),transparent 25%),radial-gradient(ellipse at 50% 70%,rgba(190,198,206,.12),transparent 38%),linear-gradient(180deg,#111820 0%,#080c12 50%,#030507 100%)}
    .boot-scene:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 16% 70%,rgba(225,230,235,.09),transparent 18%),radial-gradient(circle at 84% 67%,rgba(225,230,235,.08),transparent 17%),linear-gradient(90deg,rgba(0,0,0,.3),transparent 25%,transparent 75%,rgba(0,0,0,.34));filter:blur(1px)}
    .boot-ceiling{position:absolute;left:-15%;right:-15%;top:0;height:38%;background:linear-gradient(150deg,transparent 0 37%,rgba(240,244,247,.09) 38%,transparent 39% 100%),linear-gradient(30deg,transparent 0 52%,rgba(255,255,255,.04) 53%,transparent 54%)}.boot-light{position:absolute;width:72%;height:2px;left:-10%;top:25%;background:linear-gradient(90deg,transparent,#dce2e7,transparent);box-shadow:0 0 28px rgba(220,226,232,.45);transform:rotate(-8deg);animation:light-drift 5s ease-in-out infinite alternate}.boot-arc{position:absolute;width:115vw;height:115vw;max-width:900px;max-height:900px;left:50%;top:5%;transform:translateX(-50%);border:1px solid rgba(220,225,230,.2);border-radius:50%;box-shadow:0 0 70px rgba(214,220,226,.04)}.boot-floor{position:absolute;left:-20%;right:-20%;bottom:-4%;height:42%;background:linear-gradient(180deg,transparent,#080b10 25%),repeating-linear-gradient(88deg,transparent 0 85px,rgba(255,255,255,.035) 86px 87px),repeating-linear-gradient(178deg,transparent 0 72px,rgba(220,225,230,.035) 73px 74px);transform:perspective(500px) rotateX(58deg);transform-origin:center bottom;opacity:.85}
    .boot-content{position:relative;z-index:4;width:min(88vw,430px);min-height:100vh;margin:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:50px 24px}.boot-logo{width:132px;height:132px;display:block;border-radius:34px;filter:drop-shadow(0 0 28px rgba(214,220,226,.3))}.boot-title{margin-top:28px;font-size:36px;line-height:1;font-weight:800;letter-spacing:-1.4px}.boot-tag{margin-top:13px;color:#c0c5cc;font-size:11px;letter-spacing:4px;text-transform:uppercase}.boot-status{margin-top:54px;width:min(315px,78vw)}.boot-track{height:5px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden}.boot-progress{height:100%;width:100%;border-radius:inherit;background:linear-gradient(90deg,#8f99a3,#f4f6f8)}.boot-loading{margin-top:14px;color:#a1a8b3;font-size:10px;letter-spacing:3px;text-transform:uppercase}.boot-credit{position:absolute;bottom:27px;color:#737b87;font-size:9px;letter-spacing:2.5px;text-transform:uppercase}
    @keyframes light-drift{from{transform:translateX(-4%) rotate(-8deg)}to{transform:translateX(18%) rotate(-8deg)}}
  </style>
</head>
<body>
  <div id="boot-splash" aria-label="Loading Gym Manager"><div class="boot-scene"></div><div class="boot-ceiling"></div><div class="boot-light"></div><div class="boot-arc"></div><div class="boot-floor"></div><div class="boot-content"><img class="boot-logo" src="./icon.svg" alt="Gym Manager icon"><div class="boot-title">Gym <span>Manager</span></div><div class="boot-tag">Manage · Grow · Together</div><div class="boot-status"><div class="boot-track"><div class="boot-progress"></div></div><div class="boot-loading">Loading your gym manager</div></div><div class="boot-credit">Powered by Atelier OG</div></div></div>
  <div id="root"></div>
  <script>(function(){var splash=document.getElementById('boot-splash'),root=document.getElementById('root'),started=Date.now(),hidden=false,minimum=1200;function finish(){if(hidden)return;hidden=true;var wait=Math.max(0,minimum-(Date.now()-started));setTimeout(function(){splash.classList.add('is-done');setTimeout(function(){if(splash.parentNode)splash.remove()},1100)},wait)}var observer=new MutationObserver(function(){if(root.children.length)finish()});observer.observe(root,{childList:true});setTimeout(function(){finish()},3500)})();</script>
  <script type="module" src="./src/super-admin-fixes.js"></script><script type="module" src="./src/owner-fixes.js"></script><script type="module" src="./src/password-gate-fixes.js"></script><script type="module" src="./src/member-trainer-password-policy.js"></script><script type="module" src="./src/owner-navigation-fix.js"></script><script type="module" src="./src/main.jsx"></script><script type="module" src="./src/owner-dashboard.js"></script>
</body>
</html>
