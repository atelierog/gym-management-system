<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <meta name="theme-color" content="#080b10">
  <meta name="description" content="Gym Manager — simple gym management for owners, trainers and members.">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg">
  <title>Gym Manager</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#080b10}
    #boot-splash{position:fixed;inset:0;z-index:99999;overflow:hidden;background:#070a0f;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;opacity:1;visibility:visible;transition:opacity .9s cubic-bezier(.22,.61,.36,1),visibility .9s}
    #boot-splash.is-done{opacity:0;visibility:hidden;pointer-events:none}
    .boot-scene{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 20%,rgba(238,188,74,.18),transparent 28%),radial-gradient(ellipse at 50% 78%,rgba(223,160,42,.11),transparent 36%),linear-gradient(180deg,#121820 0%,#080c12 48%,#040609 100%)}
    .boot-ceiling{position:absolute;left:-15%;right:-15%;top:0;height:34%;background:linear-gradient(150deg,transparent 0 37%,rgba(255,210,105,.08) 38%,transparent 39% 100%),linear-gradient(30deg,transparent 0 52%,rgba(255,255,255,.035) 53%,transparent 54%)}
    .boot-light{position:absolute;width:70%;height:2px;left:-10%;top:25%;background:linear-gradient(90deg,transparent,#eac05c,transparent);box-shadow:0 0 28px rgba(234,192,92,.45);transform:rotate(-8deg);animation:light-drift 5s ease-in-out infinite alternate}
    .boot-arc{position:absolute;width:115vw;height:115vw;max-width:900px;max-height:900px;left:50%;top:5%;transform:translateX(-50%);border:1px solid rgba(238,191,82,.2);border-radius:50%;box-shadow:0 0 70px rgba(231,177,61,.04)}
    .boot-arc:after{content:"";position:absolute;width:100%;height:100%;border-radius:50%;border:1px solid rgba(238,191,82,.35);transform:rotate(26deg);border-left-color:transparent;border-bottom-color:transparent;animation:arc-spin 8s linear infinite}
    .boot-floor{position:absolute;left:-20%;right:-20%;bottom:-4%;height:42%;background:linear-gradient(180deg,transparent,#080b10 25%),repeating-linear-gradient(88deg,transparent 0 85px,rgba(255,255,255,.035) 86px 87px),repeating-linear-gradient(178deg,transparent 0 72px,rgba(238,191,82,.035) 73px 74px);transform:perspective(500px) rotateX(58deg);transform-origin:center bottom;opacity:.85}
    .boot-equipment{position:absolute;bottom:19%;left:0;right:0;height:35%;opacity:.5}
    .rack{position:absolute;right:11%;bottom:0;width:17%;height:86%;border-left:5px solid #202731;border-right:5px solid #202731;box-shadow:0 0 0 1px rgba(255,255,255,.03)}
    .rack:before,.rack:after{content:"";position:absolute;left:10%;right:10%;height:5px;background:#252d37;box-shadow:0 38px 0 #252d37,0 76px 0 #252d37}
    .rack:before{top:12%}.rack:after{bottom:0;transform:rotate(-12deg);transform-origin:left bottom}
    .bench{position:absolute;left:8%;bottom:11%;width:31%;height:6px;background:#252d37;transform:rotate(-8deg);box-shadow:0 18px 0 rgba(37,45,55,.75)}
    .bench:before{content:"";position:absolute;width:10px;height:100px;background:#202731;left:28%;top:2px;transform:rotate(15deg)}
    .bench:after{content:"";position:absolute;width:10px;height:90px;background:#202731;right:10%;top:5px;transform:rotate(-15deg)}
    .boot-content{position:relative;z-index:4;width:min(88vw,430px);min-height:100vh;margin:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:50px 24px}
    .boot-logo{position:relative;width:126px;height:126px;border-radius:34px;background:linear-gradient(145deg,#f9d776,#a66d16);padding:3px;box-shadow:0 0 0 1px rgba(255,225,135,.2),0 0 60px rgba(224,177,70,.28);animation:logo-in 1s cubic-bezier(.2,.85,.2,1) both}
    .boot-logo:before{content:"";position:absolute;inset:7px;border-radius:28px;background:#0d1117;box-shadow:inset 0 0 35px rgba(255,255,255,.045)}
    .boot-gm{position:relative;height:100%;display:flex;align-items:center;justify-content:center;font-size:45px;font-weight:900;letter-spacing:-4px;color:#f2c65c;text-shadow:0 0 24px rgba(244,201,92,.24)}
    .boot-barbell{position:absolute;top:21px;left:50%;width:32px;height:4px;transform:translateX(-50%);background:#f5ca62;border-radius:5px;box-shadow:-9px 0 0 -1px #f5ca62,9px 0 0 -1px #f5ca62}
    .boot-barbell:before,.boot-barbell:after{content:"";position:absolute;top:-6px;width:5px;height:16px;border-radius:3px;background:#f5ca62}.boot-barbell:before{left:-5px}.boot-barbell:after{right:-5px}
    .boot-title{margin-top:26px;font-size:36px;line-height:1;font-weight:800;letter-spacing:-1.4px;animation:rise .8s .25s both}.boot-title span{color:#efc653}
    .boot-tag{margin-top:13px;color:#c0c5cc;font-size:11px;letter-spacing:4px;text-transform:uppercase;animation:rise .8s .4s both}
    .boot-status{margin-top:54px;width:min(315px,78vw);animation:rise .8s .55s both}.boot-track{height:5px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden;box-shadow:inset 0 1px 2px #000}.boot-progress{height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#b77b19,#ffe58b);box-shadow:0 0 18px rgba(244,201,92,.6);animation:progress 2.35s cubic-bezier(.2,.7,.2,1) forwards}.boot-loading{margin-top:14px;color:#a1a8b3;font-size:10px;letter-spacing:3px;text-transform:uppercase}.boot-dots{display:flex;gap:6px;margin-top:18px}.boot-dots i{width:5px;height:5px;border-radius:50%;background:#cda548;animation:dot 1.1s infinite}.boot-dots i:nth-child(2){animation-delay:.14s}.boot-dots i:nth-child(3){animation-delay:.28s}.boot-credit{position:absolute;bottom:27px;color:#737b87;font-size:9px;letter-spacing:2.5px;text-transform:uppercase}
    @keyframes logo-in{from{opacity:0;transform:translateY(20px) scale(.72);filter:blur(9px)}to{opacity:1;transform:none;filter:blur(0)}}
    @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
    @keyframes progress{0%{width:0}25%{width:25%}58%{width:57%}82%{width:82%}100%{width:100%}}
    @keyframes dot{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
    @keyframes light-drift{from{transform:translateX(-4%) rotate(-8deg)}to{transform:translateX(18%) rotate(-8deg)}}
    @keyframes arc-spin{to{transform:rotate(386deg)}}
    @media(prefers-reduced-motion:reduce){.boot-logo,.boot-title,.boot-tag,.boot-status,.boot-light,.boot-arc:after,.boot-dots i{animation:none}.boot-progress{width:100%}}
  </style>
</head>
<body>
  <div id="boot-splash" aria-label="Loading Gym Manager">
    <div class="boot-scene"></div>
    <div class="boot-ceiling"></div>
    <div class="boot-light"></div>
    <div class="boot-arc"></div>
    <div class="boot-floor"></div>
    <div class="boot-equipment"><div class="rack"></div><div class="bench"></div></div>
    <div class="boot-content">
      <img class="boot-logo" src="/icon.svg" alt="Gym Manager">
      <div class="boot-title">Gym <span>Manager</span></div>
      <div class="boot-tag">Manage · Grow · Together</div>
      <div class="boot-status"><div class="boot-track"><div class="boot-progress"></div></div><div class="boot-loading">Loading your gym manager</div><div class="boot-dots" aria-hidden="true"><i></i><i></i><i></i></div></div>
      <div class="boot-credit">Powered by Atelier OG</div>
    </div>
  </div>
  <div id="root"></div>
  <script>
    (function(){
      var splash=document.getElementById('boot-splash'),root=document.getElementById('root');
      var started=Date.now(),hidden=false,minimum=2100;
      function finish(){
        if(hidden)return;
        hidden=true;
        var wait=Math.max(0,minimum-(Date.now()-started));
        setTimeout(function(){splash.classList.add('is-done');setTimeout(function(){if(splash.parentNode)splash.remove()},950)},wait);
      }
      var observer=new MutationObserver(function(){if(root.children.length)finish()});
      observer.observe(root,{childList:true});
      setTimeout(function(){finish()},3600);
      window.addEventListener('error',function(){if(root.children.length)finish()});
      window.addEventListener('unhandledrejection',function(){if(root.children.length)finish()});
    })();
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
