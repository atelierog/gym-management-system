<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <meta name="theme-color" content="#070a0f">
  <meta name="description" content="Gym Manager — simple gym management for owners, trainers and members.">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg?v=7" type="image/svg+xml">
  <link rel="stylesheet" href="./gym-manager-branding.css?v=1">
  <title>Gym Manager</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#070a0f}
    #boot-splash{position:fixed;inset:0;z-index:99999;overflow:hidden;background:#070a0f;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;opacity:1;visibility:visible;transition:opacity 1.05s cubic-bezier(.22,.61,.36,1),visibility 1.05s}
    #boot-splash.is-done{opacity:0;visibility:hidden;pointer-events:none}
    .boot-scene{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 28%,rgba(220,225,230,.18),transparent 25%),radial-gradient(ellipse at 50% 70%,rgba(190,198,206,.12),transparent 38%),linear-gradient(180deg,#111820 0%,#080c12 50%,#030507 100%)}
    .boot-scene:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 16% 70%,rgba(225,230,235,.09),transparent 18%),radial-gradient(circle at 84% 67%,rgba(225,230,235,.08),transparent 17%),linear-gradient(90deg,rgba(0,0,0,.3),transparent 25%,transparent 75%,rgba(0,0,0,.34));filter:blur(1px)}
    .boot-ceiling{position:absolute;left:-15%;right:-15%;top:0;height:38%;background:linear-gradient(150deg,transparent 0 37%,rgba(240,244,247,.09) 38%,transparent 39% 100%),linear-gradient(30deg,transparent 0 52%,rgba(255,255,255,.04) 53%,transparent 54%)}
    .boot-light{position:absolute;width:72%;height:2px;left:-10%;top:25%;background:linear-gradient(90deg,transparent,#dce2e7,transparent);box-shadow:0 0 28px rgba(220,226,232,.45);transform:rotate(-8deg);animation:light-drift 5s ease-in-out infinite alternate}
    .boot-arc{position:absolute;width:115vw;height:115vw;max-width:900px;max-height:900px;left:50%;top:5%;transform:translateX(-50%);border:1px solid rgba(220,225,230,.2);border-radius:50%;box-shadow:0 0 70px rgba(214,220,226,.04)}
    .boot-arc:after{content:"";position:absolute;width:100%;height:100%;border-radius:50%;border:1px solid rgba(220,225,230,.35);transform:rotate(26deg);border-left-color:transparent;border-bottom-color:transparent;animation:arc-spin 8s linear infinite}
    .boot-floor{position:absolute;left:-20%;right:-20%;bottom:-4%;height:42%;background:linear-gradient(180deg,transparent,#080b10 25%),repeating-linear-gradient(88deg,transparent 0 85px,rgba(255,255,255,.035) 86px 87px),repeating-linear-gradient(178deg,transparent 0 72px,rgba(220,225,230,.035) 73px 74px);transform:perspective(500px) rotateX(58deg);transform-origin:center bottom;opacity:.85}
    .boot-equipment{position:absolute;bottom:19%;left:0;right:0;height:35%;opacity:.5;filter:blur(.2px)}
    .rack{position:absolute;right:11%;bottom:0;width:17%;height:86%;border-left:5px solid #202731;border-right:5px solid #202731;box-shadow:0 0 0 1px rgba(255,255,255,.03)}
    .rack:before,.rack:after{content:"";position:absolute;left:10%;right:10%;height:5px;background:#252d37;box-shadow:0 38px 0 #252d37,0 76px 0 #252d37}
    .rack:before{top:12%}.rack:after{bottom:0;transform:rotate(-12deg);transform-origin:left bottom}
    .bench{position:absolute;left:8%;bottom:11%;width:31%;height:6px;background:#252d37;transform:rotate(-8deg);box-shadow:0 18px 0 rgba(37,45,55,.75)}
    .bench:before{content:"";position:absolute;width:10px;height:100px;background:#202731;left:28%;top:2px;transform:rotate(15deg)}
    .bench:after{content:"";position:absolute;width:10px;height:90px;background:#202731;right:10%;top:5px;transform:rotate(-15deg)}
    .boot-content{position:relative;z-index:4;width:min(88vw,430px);min-height:100vh;margin:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:50px 24px}
    .boot-logo{position:relative;width:132px;height:132px;display:block;flex:0 0 auto;border-radius:34px;filter:drop-shadow(0 0 28px rgba(214,220,226,.3));animation:logo-in 1s cubic-bezier(.2,.85,.2,1) both}
    .boot-title{margin-top:28px;font-size:36px;line-height:1;font-weight:800;letter-spacing:-1.4px;animation:rise .8s .25s both}.boot-title span{color:#e6eaee}
    .boot-tag{margin-top:13px;color:#c0c5cc;font-size:11px;letter-spacing:4px;text-transform:uppercase;animation:rise .8s .4s both}
    .boot-status{margin-top:54px;width:min(315px,78vw);animation:rise .8s .55s both}.boot-track{height:5px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden;box-shadow:inset 0 1px 2px #000}.boot-progress{height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#8f99a3,#f4f6f8);box-shadow:0 0 18px rgba(220,226,232,.6);animation:progress 2.65s cubic-bezier(.2,.7,.2,1) forwards}.boot-loading{margin-top:14px;color:#a1a8b3;font-size:10px;letter-spacing:3px;text-transform:uppercase}.boot-dots{display:flex;gap:6px;margin-top:18px}.boot-dots i{width:5px;height:5px;border-radius:50%;background:#cbd2d9;animation:dot 1.1s infinite}.boot-dots i:nth-child(2){animation-delay:.14s}.boot-dots i:nth-child(3){animation-delay:.28s}.boot-credit{position:absolute;bottom:27px;color:#737b87;font-size:9px;letter-spacing:2.5px;text-transform:uppercase}
    @keyframes logo-in{from{opacity:0;transform:translateY(20px) scale(.72);filter:blur(9px) drop-shadow(0 0 0 transparent)}to{opacity:1;transform:none;filter:blur(0) drop-shadow(0 0 28px rgba(214,220,226,.3))}}
    @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
    @keyframes progress{0%{width:0}25%{width:23%}58%{width:57%}82%{width:82%}100%{width:100%}}
    @keyframes dot{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
    @keyframes light-drift{from{transform:translateX(-4%) rotate(-8deg)}to{transform:translateX(18%) rotate(-8deg)}}
    @keyframes arc-spin{to{transform:rotate(386deg)}}
    @media(prefers-reduced-motion:reduce){.boot-logo,.boot-title,.boot-tag,.boot-status,.boot-light,.boot-arc:after,.boot-dots i{animation:none}.boot-progress{width:100%}}
  </style>
</head>
<body>
  <div id="boot-splash" aria-label="Loading Gym Manager">
    <div class="boot-scene"></div><div class="boot-ceiling"></div><div class="boot-light"></div><div class="boot-arc"></div><div class="boot-floor"></div>
    <div class="boot-equipment"><div class="rack"></div><div class="bench"></div></div>
    <div class="boot-content">
      <svg class="boot-logo" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gym Manager icon">
        <defs>
          <linearGradient id="boot-platinum" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.2" stop-color="#e9edf1"/><stop offset="0.5" stop-color="#b8c0c8"/><stop offset="0.78" stop-color="#f8fafc"/><stop offset="1" stop-color="#7d8792"/></linearGradient>
          <filter id="boot-glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <filter id="boot-soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
        </defs>
        <rect width="512" height="512" rx="116" fill="#070a0e"/>
        <rect x="22" y="22" width="468" height="468" rx="101" fill="none" stroke="#c5ccd3" stroke-width="16" opacity=".18" filter="url(#boot-soft)"/>
        <rect x="27" y="27" width="458" height="458" rx="96" fill="#0d1117" stroke="url(#boot-platinum)" stroke-width="13" filter="url(#boot-glow)"/>
        <rect x="43" y="43" width="426" height="426" rx="82" fill="#0b0f14" stroke="#eef2f5" stroke-opacity=".45" stroke-width="2"/>
        <g fill="url(#boot-platinum)" filter="url(#boot-glow)"><rect x="187" y="111" width="138" height="10" rx="5"/><rect x="165" y="98" width="12" height="37" rx="5"/><rect x="181" y="90" width="14" height="53" rx="6"/><rect x="317" y="98" width="12" height="37" rx="5"/><rect x="299" y="90" width="14" height="53" rx="6"/></g>
        <path d="M120 296c0-55 37-91 91-91h83l-30 31h-49c-30 0-50 19-50 60s20 60 50 60h45v-35h-59l27-29h73v92h-89c-54 0-92-35-92-88z" fill="url(#boot-platinum)"/>
        <path d="M270 238l42 48 44-48 34 31v86c0 13-9 23-22 23h-28v-73l-28 31-42-47z" fill="url(#boot-platinum)"/>
        <text x="256" y="409" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="6" fill="#dce2e7">GYM MANAGER</text>
      </svg>
      <div class="boot-title">Gym <span>Manager</span></div><div class="boot-tag">Manage · Grow · Together</div>
      <div class="boot-status"><div class="boot-track"><div class="boot-progress"></div></div><div class="boot-loading">Loading your gym manager</div><div class="boot-dots" aria-hidden="true"><i></i><i></i><i></i></div></div>
      <div class="boot-credit">Powered by Atelier OG</div>
    </div>
  </div>
  <div id="root"></div>
  <script src="./gym-manager-branding.js?v=1"></script>
  <script>
    (function(){var splash=document.getElementById('boot-splash'),root=document.getElementById('root'),started=Date.now(),hidden=false,minimum=2800;function finish(){if(hidden)return;hidden=true;var gate=root.querySelector('.password-gate'),wait=gate?0:Math.max(0,minimum-(Date.now()-started));setTimeout(function(){splash.classList.add('is-done');setTimeout(function(){if(splash.parentNode)splash.remove()},1100)},wait)}var observer=new MutationObserver(function(){if(root.children.length)finish()});observer.observe(root,{childList:true});setTimeout(function(){finish()},4300);window.addEventListener('error',function(){if(root.children.length)finish()});window.addEventListener('unhandledrejection',function(){if(root.children.length)finish()})})();
  </script>
  <script type="module" src="./src/super-admin-fixes.js"></script>
  <script type="module" src="./src/owner-fixes.js"></script>
  <script type="module" src="./src/password-gate-fixes.js"></script>
  <script type="module" src="./src/main.jsx"></script>
</body>
</html>
