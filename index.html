<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Gym Manager — simple gym management for owners, trainers and members.">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg">
  <title>Gym Manager</title>
</head>
<body>
  <div id="root">
    <div id="boot-fallback" style="min-height:100vh;display:grid;place-items:center;font-family:system-ui,Arial;background:#111827;color:#fff;padding:24px;text-align:center">
      <div><h1 style="margin:0 0 8px">Gym Manager</h1><p style="margin:0;color:#d1d5db">Starting…</p></div>
    </div>
  </div>
  <script>
    window.addEventListener("error",function(e){var r=document.getElementById("boot-fallback");if(r)r.innerHTML="<div><h1>Gym Manager</h1><p>Something went wrong while starting the app.</p><small>"+String(e.error?.message||e.message||"Unknown startup error").replace(/[<>]/g,"")+"</small></div>"});
    window.addEventListener("unhandledrejection",function(e){var r=document.getElementById("boot-fallback");if(r)r.innerHTML="<div><h1>Gym Manager</h1><p>Something went wrong while starting the app.</p><small>"+String(e.reason?.message||e.reason||"Unknown startup error").replace(/[<>]/g,"")+"</small></div>"});
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
